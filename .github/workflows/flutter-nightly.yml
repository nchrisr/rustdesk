name: Flutter Nightly Build

on:
  # Manual only: this fork builds its deliverables with
  # .github/workflows/velour-release.yml, on demand.
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
